<!doctype html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var u = new URL(location.href);
          if (u.searchParams.has('airoShareToken')) {
            u.searchParams.delete('airoShareToken');
            history.replaceState(null, '', u.toString());
          }
        } catch (e) {}
      })();
    </script>
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Scroll-in motion: anything with class "reveal" rises into view the first time it reaches the screen.
         Runs before the app loads so it also works on the prerendered pages; without JavaScript nothing is hidden. */
      (function () {
        var d = document.documentElement;
        if (!('IntersectionObserver' in window) || !('MutationObserver' in window)) return;
        d.classList.add('js');
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.setAttribute('data-in', ''); io.unobserve(e.target); }
          });
        }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });
        var watch = function (root) {
          if (root.matches && root.matches('.reveal:not([data-in])')) io.observe(root);
          if (root.querySelectorAll) root.querySelectorAll('.reveal:not([data-in])').forEach(function (el) { io.observe(el); });
        };
        // Backup for browsers that pause the observer: a light position check on scroll
        var timer = 0;
        var check = function () {
          timer = 0;
          var limit = window.innerHeight * 0.96;
          document.querySelectorAll('.reveal:not([data-in])').forEach(function (el) {
            var r = el.getBoundingClientRect();
            if (r.top < limit && r.bottom > 0) { el.setAttribute('data-in', ''); io.unobserve(el); }
          });
        };
        window.addEventListener('scroll', function () { if (!timer) timer = setTimeout(check, 150); }, { passive: true });
        var start = function () {
          watch(document);
          check();
          new MutationObserver(function (list) {
            list.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) watch(n); }); });
          }).observe(document.body, { childList: true, subtree: true });
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
      })();
    </script>
    <!--app-head-->
    <script defer src="/airo-video-slots.js"></script>
    <script defer src="/airo-logo-orientation.js"></script>
  </head>
  <body class="fs-unmask-airo-app-builder">
    <div id="app" class="fs-unmask-airo-app-builder"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/analytics.js"></script>
  </body>
</html>
